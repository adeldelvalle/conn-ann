[build-system]
requires = ["setuptools>=61", "wheel", "Cython>=3.0", "numpy>=1.24"]
build-backend = "setuptools.build_meta"

[project]
name = "spectral-lsh"
version = "0.3.0"
description = "Locality-sensitive hashing that builds neighbour graphs from collision consensus, with a compiled multi-probe retrieval path."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
clustering = ["python-igraph>=0.10", "leidenalg>=0.9", "networkx>=3.0"]
bench = ["faiss-cpu>=1.7", "scikit-learn>=1.2", "scipy>=1.10"]
dev = ["pytest>=7.0", "Cython>=3.0"]

[tool.setuptools]
packages = ["spectral_lsh", "spectral_lsh_fast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
