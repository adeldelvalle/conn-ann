[build-system]
requires = ["setuptools>=61", "wheel", "Cython>=3.0", "numpy>=2.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "conn-ann"
version = "0.1.0"
description = "CoNN - Co-occurrence Nearest Neighbours: neighbour search and graph construction from LSH collision consensus, with a compiled multi-probe retrieval path."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Adel del Valle", email = "adel.delvalle@upr.edu"}]
keywords = ["locality-sensitive-hashing", "lsh", "nearest-neighbor", "ann",
            "clustering", "community-detection", "cython"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Cython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/adeldelvalle/conn-ann"
Repository = "https://github.com/adeldelvalle/conn-ann"
Issues = "https://github.com/adeldelvalle/conn-ann/issues"

[project.optional-dependencies]
clustering = ["python-igraph>=0.10", "leidenalg>=0.9", "networkx>=3.0"]
bench = ["faiss-cpu>=1.7", "scikit-learn>=1.2", "scipy>=1.10"]
dev = ["pytest>=7.0", "Cython>=3.0"]

[tool.setuptools]
packages = ["conn_ann", "conn_ann.fast"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.cibuildwheel]
# 3.9 is the floor declared in requires-python. Skip 32-bit, musl and PyPy:
# the extension is fine on them, but they are not worth the build minutes yet.
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-win32 *-manylinux_i686 *musllinux* pp*"
test-requires = "pytest"
test-command = "pytest {project}/tests -q"
build-verbosity = 1

# cibuildwheel defaults to manylinux2014 (glibc 2.17), but numpy only ships
# manylinux_2_27 wheels for Python 3.11+. In a 2.17 container pip therefore has
# to compile numpy from source to satisfy the build requirement - which took
# 209s on cp311 and failed outright on cp312. Building in a glibc 2.28 image
# lets pip use numpy's own wheels. Resulting wheels need glibc >= 2.28, which
# every supported distro has had since 2018 (RHEL 8, Ubuntu 18.10, Debian 10).
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
# One universal2 wheel covers Intel and Apple silicon, which matters now that
# GitHub has retired its Intel (macos-13) runners. Do NOT use
# archs = ["x86_64", "arm64"]: that builds two separate wheels and makes the
# arm64 runner test the x86_64 one through Rosetta, which is how cp311 failed
# with `arch -x86_64 ... failed with code 1`.
archs = ["universal2"]
# Testing the Intel half would mean Rosetta again; the arm64 half is tested.
test-skip = "*universal2:x86_64"
